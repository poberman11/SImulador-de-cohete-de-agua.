<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Proyectil de Agua</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Simulador de Proyectil de Agua</h1>
  </header>
  <main>
    <form id="form-lanzamiento" novalidate>
      <div class="campo">
        <label for="litros-proyectil">Litros del proyectil (kg-equivalente)</label>
        <input type="number" id="litros-proyectil" name="litrosProyectil" step="0.01" min="0" required>
        <span class="error" id="error-litros-proyectil" aria-live="polite"></span>
      </div>
      <div class="campo">
        <label for="litros-agua">Litros de agua (máx. 2 L)</label>
        <input type="number" id="litros-agua" name="litrosAgua" step="0.01" min="0" max="2" required>
        <span class="error" id="error-litros-agua" aria-live="polite"></span>
      </div>
      <div class="campo">
        <label for="psi">Presión (PSI)</label>
        <input type="number" id="psi" name="psi" step="0.1" min="0" required>
        <span class="error" id="error-psi" aria-live="polite"></span>
      </div>
      <div class="campo">
        <label for="angulo">Ángulo de lanzamiento (°)</label>
        <input type="number" id="angulo" name="anguloGrados" step="0.1" min="0" max="90" required>
        <span class="error" id="error-angulo" aria-live="polite"></span>
      </div>
      <div class="acciones">
        <button type="submit">Simular / Lanzar</button>
      </div>
    </form>
    <div id="resultado" class="resultado" aria-live="polite"></div>

    <section id="visualizacion" aria-label="Visualización del lanzamiento">
      <div id="estado-vacio" class="estado-vacio">Complete los datos y lance</div>

      <div class="visualizacion-fila">
        <canvas
          id="trayectoria"
          width="640"
          height="360"
          role="img"
          aria-label="Trayectoria del proyectil"
          hidden
        ></canvas>
        <div id="resumen" class="resumen" hidden></div>
      </div>

      <div class="tabla-envoltorio" hidden>
        <table id="puntos" aria-label="Puntos de la trayectoria">
          <caption>Puntos de la trayectoria</caption>
          <thead>
            <tr>
              <th scope="col">t (s)</th>
              <th scope="col">x (m)</th>
              <th scope="col">y (m)</th>
              <th scope="col">vx (m/s)</th>
              <th scope="col">vy (m/s)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer>
    <p>Simulador cliente-side &mdash; cero dependencias externas.</p>
  </footer>
  <script src="app.js" defer></script>
</body>
</html>
